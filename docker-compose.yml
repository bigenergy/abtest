name: blog

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    # Run as the host user so that files created in the container (vendor/, var/)
    # are not owned by root on Linux hosts
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: blog
      DB_USER: blog
      DB_PASSWORD: secret
      COMPOSER_HOME: /tmp/composer
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      # Executed only once, when the data volume is empty
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/test-database.sql:/docker-entrypoint-initdb.d/02-test-database.sql:ro
    healthcheck:
      # TCP ping fails until the server finishes its initialization
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
